name: Offline Action checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-contract-and-file-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified from the official repository
      - name: Run loopback protocol and file-safety checks
        run: python3 -m unittest discover -s tests -v
